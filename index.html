const REVEAL_SELECTOR=".now-card,.day-row,.exchange-card,.exchange-result,.exchange-rates,.tab,.t-row,.transport-budget,.travel-warning,.prep-card,.prep-packing-progress,.transit-card";
function initRevealSystem(){
  if(!("IntersectionObserver" in window) || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const revealObserver=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(!entry.isIntersecting) return;
      entry.target.classList.add("is-revealed");
      revealObserver.unobserve(entry.target);
    });
  },{threshold:.08});
  const observe=(root=document)=>{
    if(!(root instanceof Element || root instanceof Document)) return;
    const items=[];
    if(root instanceof Element && root.matches(REVEAL_SELECTOR)) items.push(root);
    root.querySelectorAll(REVEAL_SELECTOR).forEach(item=>items.push(item));
    items.forEach(item=>{
      if(item.dataset.revealBound) return;
      item.dataset.revealBound="true";
      item.classList.add("reveal");
      revealObserver.observe(item);
    });
  };
  observe();
  new MutationObserver(mutations=>{
    mutations.forEach(mutation=>mutation.addedNodes.forEach(node=>{
      if(node.nodeType===Node.ELEMENT_NODE) observe(node);
    }));
  }).observe(document.body,{childList:true,subtree:true});
}
