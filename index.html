<!DOCTYPE html>
<html lang="zh-Hant" data-palette="ink">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>澳門・珠海・中山｜旅行手冊</title>
<meta name="theme-color" content="#0C0C0C">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 巨字用 block：字型載入前先隱藏，避免備用字型較寬而被裁切；中文字型較大，用 swap 先顯示 -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Unbounded:wght@500;700;800&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<script>
  /* 在畫面出現前套用上次選的配色（預設：配色 01）；深淺色跟隨裝置 */
  (function(){
    var p="ink";
    try{
      var s=JSON.parse(localStorage.getItem("trip_theme_v1")||"{}");
      if(["ink","ember","navy"].indexOf(s.palette)>-1) p=s.palette;
    }catch(_){}
    document.documentElement.setAttribute("data-palette",p);
  })();
</script>
<style>
  /* =========================================================
     版面概念：巨字海報。手機直向單欄＋底部 Dock；
     手機橫向／平板／電腦改左右兩欄（左：黏住的巨字，右：頁面內容）＋頂部選單。
     配色：data-palette = ink / ember / navy；深淺色跟隨裝置設定（prefers-color-scheme）
     ========================================================= */

  /* ---- 1. 三組配色：各自定義深色（--d-*）與淺色（--l-*）原始色 ---- */
  :root,
  html[data-palette="ink"]{
    --d-bg:#0C0C0C; --d-fg:#ECE9E3; --d-dim:#8F8B85; --d-line:#2A2826; --d-card:#171615; --d-accent:#ECE9E3;
    --l-bg:#F3F1EC; --l-fg:#121212; --l-dim:#5F5B55; --l-line:#D6D2CA; --l-card:#FAF9F6; --l-accent:#121212;
  }
  html[data-palette="ember"]{
    --d-bg:#0D0C0B; --d-fg:#F2EFEA; --d-dim:#928C84; --d-line:#2B2724; --d-card:#181614; --d-accent:#FF5A36;
    --l-bg:#F5F2EC; --l-fg:#151413; --l-dim:#615B54; --l-line:#DAD4CA; --l-card:#FBF9F5; --l-accent:#BF3312;
  }
  html[data-palette="navy"]{
    --d-bg:#0A1020; --d-fg:#E6ECF5; --d-dim:#8794AB; --d-line:#1E2940; --d-card:#111A2E; --d-accent:#7FB2FF;
    --l-bg:#EEF2F8; --l-fg:#0E1A33; --l-dim:#56627A; --l-line:#CFD7E4; --l-card:#F7F9FC; --l-accent:#2453D6;
  }

  /* ---- 2. 深淺色：跟隨裝置，把原始色對應到實際使用的變數 ----
     淺色模式的 NOW 卡片與 Dock 是反白（深底），所以裡面改用深色組的強調色 */
  :root{
    --bg:var(--l-bg); --fg:var(--l-fg); --dim:var(--l-dim); --line:var(--l-line); --surface:var(--l-card); --accent:var(--l-accent);
    --now-bg:var(--l-fg); --now-fg:var(--l-bg); --now-dim:var(--d-dim); --now-accent:var(--d-accent); --now-line:rgba(255,255,255,.16);
    --dock-bg:var(--l-fg); --dock-fg:var(--l-bg); --dock-dim:var(--d-dim);
    --shade:rgba(0,0,0,.18);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:var(--d-bg); --fg:var(--d-fg); --dim:var(--d-dim); --line:var(--d-line); --surface:var(--d-card); --accent:var(--d-accent);
      --now-bg:var(--d-card); --now-fg:var(--d-fg); --now-dim:var(--d-dim); --now-accent:var(--d-accent); --now-line:var(--d-line);
      --dock-bg:var(--d-fg); --dock-fg:var(--d-bg); --dock-dim:var(--l-dim);
      --shade:rgba(0,0,0,.45);
      color-scheme:dark;
    }
  }

  /* ---- 3. 字體與節奏 ---- */
  :root{
    --f-big:'Anton','Huninn','Arial Narrow',sans-serif;          /* 巨字、數字 */
    --f-tag:'Unbounded','Huninn',system-ui,sans-serif;          /* 小標籤 */
    --f-zh:'Huninn','PingFang TC','Microsoft JhengHei',sans-serif; /* 中文：jf open 粉圓（圓體、開源） */
    --f-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
    --r:16px;
  }

  /* ---- 4. 基礎 ---- */
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; width:100%; overflow-x:hidden; }
  body{
    background:var(--bg); color:var(--fg);
    font-family:var(--f-zh); font-weight:400; font-size:15.5px; line-height:1.6;
    font-synthesis:none;               /* 粉圓只有一種粗細，不讓瀏覽器硬加粗 */
    padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px));
    transition:background-color .4s ease, color .4s ease;
  }
  button{ font:inherit; color:inherit; border:0; background:none; padding:0; cursor:pointer; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:6px; }
  ::selection{ background:var(--fg); color:var(--bg); }
  .mono{ font-variant-numeric:tabular-nums; }
  .serif{ font-family:inherit; }

  .wrap{
    max-width:1200px; margin:0 auto;
    padding-top:max(16px, env(safe-area-inset-top, 0px));
    padding-left:max(20px, env(safe-area-inset-left, 0px));
    padding-right:max(20px, env(safe-area-inset-right, 0px));
  }

  /* ---- 5. 頂部列：品牌、選單（寬版）、配色切換 ---- */
  .top{ position:relative; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:10px 14px; flex-wrap:wrap; }
  .brand{ font-family:var(--f-tag); font-size:11px; font-weight:700; letter-spacing:.14em; white-space:nowrap; }
  .links{ display:none; gap:4px 20px; flex-wrap:wrap; }
  .links .nav-btn{ min-height:44px; font-size:14px; font-weight:700; color:var(--dim); transition:color .25s ease; white-space:nowrap; }
  .links .nav-btn:hover,.links .nav-btn.active{ color:var(--fg); }
  .links > .pill{ background:var(--accent); border-radius:2px; }
  .sw{ display:block; width:10px; height:10px; border-radius:50%; flex:none; box-shadow:inset 0 0 0 1px rgba(127,127,127,.45); }
  .sw-ink{ background:linear-gradient(135deg,#0C0C0C 50%,#ECE9E3 50%); }
  .sw-ember{ background:linear-gradient(135deg,#0D0C0B 50%,#FF5A36 50%); }
  .sw-navy{ background:linear-gradient(135deg,#0A1020 50%,#7FB2FF 50%); }
  /* 配色切換：平常只是一顆小圓點，點開才展開三個色票 */
  .palette{ position:relative; display:flex; align-items:center; justify-content:flex-end; }
  .pal-toggle{ width:36px; height:36px; border-radius:50%; display:grid; place-items:center; border:1px solid var(--line);
               transition:transform .4s var(--ease), border-color .25s ease; }
  .pal-toggle:hover{ border-color:var(--fg); }
  .pal-toggle .sw{ width:14px; height:14px; transition:transform .4s var(--ease); }
  .palette.open .pal-toggle{ transform:rotate(180deg); border-color:var(--fg); }
  .pal-menu{ position:absolute; right:42px; top:50%; display:flex; gap:6px; padding:4px; border:1px solid var(--line); border-radius:999px; background:var(--bg);
             transform:translateY(-50%) translateX(12px) scale(.9); transform-origin:right center; opacity:0; visibility:hidden; pointer-events:none;
             transition:transform .45s var(--ease), opacity .25s ease, visibility 0s linear .45s; }
  .palette.open .pal-menu{ transform:translateY(-50%); opacity:1; visibility:visible; pointer-events:auto; transition:transform .45s var(--ease), opacity .25s ease; }
  .pal-opt{ width:32px; height:32px; border-radius:50%; display:grid; place-items:center; opacity:0; transform:scale(.4);
            transition:transform .4s var(--ease), opacity .25s ease, box-shadow .25s ease; }
  .palette.open .pal-opt{ opacity:1; transform:none; }
  .palette.open .pal-opt:nth-child(1){ transition-delay:.04s; } .palette.open .pal-opt:nth-child(2){ transition-delay:.08s; } .palette.open .pal-opt:nth-child(3){ transition-delay:.12s; }
  .pal-opt .sw{ width:22px; height:22px; }
  .pal-opt[aria-pressed="true"]{ box-shadow:0 0 0 1.5px var(--fg); }
  .pal-opt:hover .sw{ transform:scale(1.12); }
  .pal-opt .sw{ transition:transform .3s var(--ease); }

  /* ---- 6. 兩欄格線 ---- */
  .grid{ display:grid; grid-template-columns:minmax(0,1fr); gap:22px; margin-top:18px; }
  .side{ min-width:0; }

  /* ---- 7. 巨字海報 ---- */
  .hero{ position:relative; container-type:inline-size; min-width:0; --cap:100vw; }
  .hero h1{ margin:0; font-weight:400; }
  .big{ display:block; overflow:hidden; white-space:nowrap; font-family:var(--f-big); font-weight:400; line-height:.9; letter-spacing:.005em; }
  .l1{ font-size:min(35cqw, calc(var(--cap) * 35)); }
  .l2{ font-size:min(32cqw, calc(var(--cap) * 32)); }
  .l3{ font-size:min(20.5cqw, calc(var(--cap) * 20.5)); }
  .l4{ font-size:min(31cqw, calc(var(--cap) * 31)); }
  .ol{ color:transparent; -webkit-text-stroke:1.5px var(--accent); }
  .fl{ display:block; animation:slideL 1.1s var(--ease) both; }
  .fr{ display:block; text-align:right; animation:slideR 1.1s var(--ease) both; }
  @keyframes slideL{ from{ transform:translateX(-102%); } to{ transform:none; } }
  @keyframes slideR{ from{ transform:translateX(102%); } to{ transform:none; } }
  .hero-sub{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
  .hero-zh{ font-size:clamp(17px,5.2cqw,30px); letter-spacing:.04em; }
  .hero-dt{ font-family:var(--f-big); font-size:clamp(18px,5cqw,32px); white-space:nowrap; }
  .trip-progress{ display:flex; align-items:center; gap:12px; margin-top:12px; font-family:var(--f-tag); font-size:10px; font-weight:700; letter-spacing:.14em; }
  .trip-progress-label{ color:var(--dim); white-space:nowrap; }
  .trip-progress-value{ white-space:nowrap; font-weight:800; }
  .trip-progress-line{ flex:1; height:2px; border-radius:1px; background:var(--line); overflow:hidden; min-width:40px; }
  .trip-progress-line i{ display:block; height:100%; background:var(--accent); transition:width .8s var(--ease); }
  .fade{ animation:fadeUp .8s var(--ease) both; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }

  /* 手機直向：非首頁時收起巨字，讓內容直接出現（各頁有自己的大標） */
  body:not([data-page="home"]) .hero{ display:none; }

  /* ---- 8. 頁面 ---- */
  .page{ display:none; container-type:inline-size; }
  .page.active{ display:block; animation:fadeUp .5s var(--ease) both; }
  .page-head{ margin:4px 0 18px; padding-bottom:12px; border-bottom:1px solid var(--line); }
  .ph-big{ display:block; overflow:hidden; white-space:nowrap; font-family:var(--f-big); font-weight:400; line-height:.92;
           font-size:min(calc(168cqw / 9), 120px); }
  .ph-row{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:4px 12px; margin-top:8px; }
  .ph-zh{ flex:1 1 auto; min-width:0; font-size:19px; letter-spacing:.03em; }
  .ph-tag{ font-family:var(--f-tag); font-size:10px; font-weight:700; letter-spacing:.14em; color:var(--dim); white-space:nowrap; }

  .label{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin:24px 0 4px; padding-bottom:8px; border-bottom:1px solid var(--line);
          font-size:17px; }
  .label em{ font-style:normal; font-family:var(--f-tag); font-size:10px; font-weight:700; letter-spacing:.12em; color:var(--dim); }
  .last-updated{ margin:26px 0 8px; text-align:center; font-family:var(--f-tag); font-size:10px; letter-spacing:.1em; color:var(--dim); }

  /* ---- 9. NOW 卡片（淺色模式為反白深底） ---- */
  .now-card{ background:var(--now-bg); color:var(--now-fg); border:1px solid var(--line); border-radius:18px; padding:18px; }
  .now-k{ display:flex; justify-content:space-between; align-items:center; gap:10px; font-family:var(--f-tag); font-size:10px; font-weight:700; letter-spacing:.14em; }
  .now-tag{ display:flex; align-items:center; gap:8px; }
  .now-clock{ color:var(--now-dim); text-align:right; }
  .dot{ width:7px; height:7px; border-radius:50%; flex:none; background:var(--now-dim); }
  .dot.live{ background:var(--now-accent); animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 50%{ opacity:.25; } }
  .now-title{ margin-top:10px; font-size:24px; font-weight:900; line-height:1.35; overflow-wrap:anywhere; }
  .now-addr{ margin-top:4px; font-size:13px; color:var(--now-dim); overflow-wrap:anywhere; }
  .now-bar{ margin-top:14px; display:flex; align-items:center; gap:10px; font-family:var(--f-tag); font-size:11px; font-weight:700; }
  .now-bar .bar{ flex:1; height:2px; border-radius:1px; background:var(--now-line); overflow:hidden; }
  .now-bar .fill{ height:100%; background:var(--now-accent); transition:width .8s var(--ease); }
  .now-bar .e{ color:var(--now-dim); }
  .next-line{ margin-top:12px; font-size:13px; color:var(--now-dim); overflow-wrap:anywhere; }
  .next-line b{ color:var(--now-fg); font-weight:700; }
  .now-remain{ margin-top:10px; padding-top:10px; border-top:1px solid var(--now-line); font-size:13px; color:var(--now-dim); }
  .now-remain b{ color:var(--now-fg); font-weight:900; }
  .now-msg{ margin-top:10px; font-size:14px; color:var(--now-dim); }

  /* ---- 10. 首頁行程列表 ---- */
  .day-nav{ display:flex; flex-direction:column; }
  .day-row{ display:flex; align-items:center; gap:14px; width:100%; min-height:48px; padding:10px 4px; text-align:left;
            border-bottom:1px solid var(--line); border-radius:10px;
            transition:background-color .3s ease, color .3s ease, padding .3s var(--ease); }
  .day-row .d{ flex:none; width:32px; font-family:var(--f-big); font-size:20px; color:var(--accent); }
  .day-row .r{ flex:1; min-width:0; font-size:16px; font-weight:700; overflow-wrap:anywhere; }
  .day-row .dt{ flex:none; font-family:var(--f-tag); font-size:10px; font-weight:700; opacity:.7; }
  .day-row .arrow{ flex:none; font-size:14px; opacity:.5; }
  .day-row.today .r::after{ content:"TODAY"; margin-left:8px; font-family:var(--f-tag); font-size:9px; letter-spacing:.12em; color:var(--accent); }
  @media (hover:hover){
    .day-row:hover{ background:var(--fg); color:var(--bg); padding-left:12px; padding-right:12px; }
    .day-row:hover .d,.day-row:hover .r::after{ color:var(--bg); }
  }

  /* ---- 11. 行程頁：日期頁籤與時間軸 ---- */
  .tabs{ display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:6px; margin:0 0 18px; }
  .tab{ min-height:56px; border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
        transition:background-color .25s ease, color .25s ease, border-color .25s ease; }
  .tab span:first-child{ font-family:var(--f-big); font-size:20px; line-height:1; color:var(--accent); }
  .tab .dt{ font-family:var(--f-tag); font-size:9px; font-weight:700; color:var(--dim); }
  .tab.active{ background:var(--fg); border-color:var(--fg); }
  .tab.active span:first-child,.tab.active .dt{ color:var(--bg); }
  @media (hover:hover){ .tab:not(.active):hover{ border-color:var(--fg); } }

  .empty-day{ padding:56px 20px; text-align:center; color:var(--dim); border:1px dashed var(--line); border-radius:var(--r); }
  .timeline{ position:relative; }
  .t-row{ display:flex; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .t-time{ flex:none; width:50px; padding-top:1px; font-family:var(--f-big); font-size:18px; line-height:1.3; letter-spacing:.02em; }
  .t-mid{ flex:none; width:12px; display:flex; justify-content:center; padding-top:9px; }
  .t-dot{ width:7px; height:7px; border-radius:50%; background:var(--line); }
  .t-dot.current{ background:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); animation:pulse 1.4s ease-in-out infinite; }
  .t-body{ flex:1; min-width:0; }
  .t-head{ display:flex; align-items:flex-start; gap:8px; min-width:0; }
  .t-icon{ flex:none; font-size:16px; line-height:1.6; font-family:var(--f-emoji); }
  .t-title{ flex:1; min-width:0; font-size:16px; font-weight:700; line-height:1.5; overflow-wrap:anywhere; }
  .t-tag{ flex:none; margin-top:3px; padding:2px 7px; border-radius:999px; background:var(--accent); color:var(--bg);
          font-family:var(--f-tag); font-size:9px; font-weight:700; letter-spacing:.12em; }
  .t-chev{ flex:none; margin-top:3px; font-size:10px; color:var(--dim); transition:transform .25s var(--ease); }
  .t-row.open .t-chev{ transform:rotate(90deg); }
  .t-detail{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .3s var(--ease), margin .3s var(--ease); }
  .t-detail > .t-detail-inner{ overflow:hidden; min-height:0; }
  .t-row.open .t-detail{ grid-template-rows:1fr; margin-top:10px; }
  .t-detail-inner{ background:var(--surface); border:1px solid transparent; border-radius:14px; padding:0 14px; cursor:default; }
  .t-row.open .t-detail-inner{ padding:14px; border-color:var(--line); }
  .t-row:not(.open) .t-detail-inner{ border-width:0; background:transparent; }
  .d-desc{ font-size:14px; color:var(--dim); line-height:1.65; margin-bottom:6px; overflow-wrap:anywhere; }
  .d-line{ display:flex; gap:8px; padding:5px 0; font-size:14px; align-items:flex-start; }
  .d-line .k{ flex:none; width:20px; font-family:var(--f-emoji); }
  .d-line .v{ flex:1; min-width:0; overflow-wrap:anywhere; }
  .img-placeholder{ height:110px; margin-bottom:12px; border:1px dashed var(--line); border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--dim); font-size:12px; }
  .d-img{ display:block; width:100%; height:130px; object-fit:cover; border-radius:10px; margin-bottom:12px; }
  .recs{ margin-top:6px; }
  .rec-title{ font-family:var(--f-tag); font-size:10px; font-weight:700; letter-spacing:.12em; color:var(--dim); margin-bottom:4px; }
  .rec-item{ position:relative; padding:2px 0 2px 14px; font-size:13px; overflow-wrap:anywhere; }
  .rec-item::before{ content:"·"; position:absolute; left:3px; color:var(--accent); }
  .btn-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .btn{ flex:1 1 auto; min-width:100px; min-height:42px; display:flex; align-items:center; justify-content:center; padding:0 14px;
        border:1px solid var(--line); border-radius:999px; font-size:13px; font-weight:700; cursor:pointer;
        transition:background-color .25s ease, color .25s ease, border-color .25s ease; }
  .btn.primary{ background:var(--fg); color:var(--bg); border-color:var(--fg); }
  @media (hover:hover){ .btn:not(.primary):hover{ border-color:var(--fg); } }

  /* 每日預算、機場時間、提醒 */
  .transport-budget,.travel-warning{ margin-top:20px; padding:16px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); }
  .tb-title,.tw-title{ font-size:14px; font-weight:900; margin-bottom:10px; }
  .tb-line{ display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-size:13px; color:var(--dim); }
  .tb-line .v{ color:var(--fg); font-weight:700; text-align:right; min-width:0; overflow-wrap:anywhere; font-variant-numeric:tabular-nums; }
  .tb-group{ margin:10px 0 2px; font-family:var(--f-tag); font-size:10px; font-weight:700; letter-spacing:.12em; color:var(--dim); }
  .tb-total{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:14px; }
  .tb-total b{ font-family:var(--f-big); font-size:18px; font-weight:400; color:var(--accent); letter-spacing:.02em; }
  .tb-note{ margin-top:8px; font-size:12px; color:var(--dim); line-height:1.6; }
  .travel-warning{ border-color:var(--accent); }
  .tw-title{ color:var(--accent); }
  .tw-intro,.tw-detail{ font-size:13px; line-height:1.65; }
  .tw-detail{ margin-top:6px; color:var(--dim); }
  .tw-list{ margin:8px 0; padding-left:20px; font-size:13px; line-height:1.7; }
  .flight-arrival-status{ margin-top:10px; font-size:13px; font-weight:700; }

  /* 全螢幕地圖（固定深底，讓地圖細節清楚） */
  .transit-lightbox{ position:fixed; inset:0; z-index:90; display:none; flex-direction:column;
    padding:max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
    background:rgba(8,8,8,.92); color:#ECE9E3; -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); }

  .transit-map-viewport{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; border:1px solid rgba(236,233,227,.18); border-radius:16px; touch-action:none; outline:none; }
  .transit-lightbox :focus-visible{ outline-color:#ECE9E3; }
  .transit-lightbox-image{ width:100%; height:100%; object-fit:contain; transform-origin:center; cursor:grab; user-select:none; -webkit-user-drag:none; }
  .transit-map-viewport.dragging .transit-lightbox-image{ cursor:grabbing; }

  /* ---- 15. 底部 Dock（手機直向） ---- */
  .navbar{ position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:50;
           display:flex; gap:4px; padding:6px; border-radius:999px; background:var(--dock-bg); box-shadow:0 10px 36px var(--shade); }
  .navbar .nav-btn{ width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--dock-dim);
                    transition:transform .3s var(--ease), color .25s ease, background-color .25s ease; }
  .navbar .nav-btn svg{ width:21px; height:21px; }
  .navbar .nav-btn.active{ background:var(--dock-fg); color:var(--dock-bg); }
  @media (hover:hover){ .navbar .nav-btn:not(.active):hover{ transform:translateY(-3px) scale(1.08); color:var(--dock-fg); } }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* ---- 16. 模擬時間工具 ---- */
  .test-fab{ position:fixed; z-index:60; right:max(12px, env(safe-area-inset-right, 0px)); bottom:calc(23px + env(safe-area-inset-bottom, 0px));
             width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center;
             border:1px solid var(--line); background:var(--bg); color:var(--dim);
             font-family:var(--f-tag); font-size:9px; font-weight:800; letter-spacing:.08em; cursor:pointer; opacity:.8; }
  .test-fab.on{ border-color:var(--accent); color:var(--accent); opacity:1; }
  .test-sheet{ position:fixed; left:0; right:0; bottom:0; z-index:70; max-width:460px; margin:0 auto;
               padding:18px max(20px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
               background:var(--surface); color:var(--fg); border:1px solid var(--line); border-bottom:0; border-radius:22px 22px 0 0;
               box-shadow:0 -10px 40px var(--shade); transform:translateY(110%); visibility:hidden; transition:transform .35s var(--ease), visibility 0s linear .35s; }
  .test-sheet.open{ transform:none; visibility:visible; transition:transform .35s var(--ease); }
  .test-title{ margin-bottom:12px; font-family:var(--f-tag); font-size:10px; font-weight:700; letter-spacing:.14em; color:var(--dim); }
  .test-row{ display:flex; gap:8px; margin-bottom:10px; }
  .test-btn{ flex:1; min-height:42px; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:999px; font-size:13px; font-weight:700; cursor:pointer; }
  .test-btn.active{ background:var(--fg); color:var(--bg); border-color:var(--fg); }
  input[type="datetime-local"]{ width:100%; min-height:44px; margin-bottom:10px; padding:0 12px; border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--fg); font:700 14px var(--f-zh); }
  .presets{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ min-height:34px; display:inline-flex; align-items:center; padding:0 12px; border:1px solid var(--line); border-radius:999px; font-family:var(--f-tag); font-size:10px; font-weight:700; cursor:pointer; }
  @media (hover:hover){ .chip:hover{ border-color:var(--fg); } }
  .test-close{ margin-top:12px; min-height:40px; display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--dim); cursor:pointer; }

  .toast{ position:fixed; left:50%; bottom:calc(88px + env(safe-area-inset-bottom, 0px)); z-index:80; transform:translate(-50%,8px);
          padding:10px 18px; border-radius:999px; background:var(--fg); color:var(--bg); font-size:13px; font-weight:700; white-space:nowrap;
          opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s var(--ease); }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  /* 捲動淡入：只作用於 JS 加上 .reveal 的元素 */
  .reveal{ opacity:0; transform:translateY(10px); transition:opacity .6s var(--ease), transform .6s var(--ease); }
  .reveal.is-revealed{ opacity:1; transform:none; }

  /* ---- 17. 兩欄：手機橫向、平板、電腦 ---- */
  @media (min-width:768px), (orientation:landscape) and (min-width:560px){
    body{ padding-bottom:40px; }
    .links{ display:flex; }
    .navbar{ display:none; }
    .grid{ grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:clamp(28px,4vw,56px); align-items:start; margin-top:24px; }
    .hero{ position:sticky; top:max(16px, env(safe-area-inset-top, 0px)); --cap:.62vh; }

    .test-fab{ bottom:calc(20px + env(safe-area-inset-bottom, 0px)); }
    .toast{ bottom:calc(28px + env(safe-area-inset-bottom, 0px)); }
    .ph-big{ font-size:min(calc(150cqw / 9), 88px); }
  }
  /* 寬度不夠放三組時，選單換到第二行 */
  @media (min-width:560px) and (max-width:1099px){
    .links{ order:3; width:100%; border-top:1px solid var(--line); }
  }
  /* 手機橫向（矮螢幕）：只留兩行巨字 */
  @media (orientation:landscape) and (max-height:520px){
    .wrap{ padding-top:max(10px, env(safe-area-inset-top, 0px)); }

    .hero{ top:max(10px, env(safe-area-inset-top, 0px)); --cap:1.05vh; }

    .links .nav-btn{ min-height:40px; font-size:13px; }
  }
  @media (orientation:landscape) and (max-height:520px) and (max-width:739px){ .brand{ display:none; } }

  /* ---- 18. 減少動態效果 ---- */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation:none !important; transition:none !important; scroll-behavior:auto !important; }
    .reveal{ opacity:1; transform:none; }
  }

  /* =========================================================
     動態效果（參考 React Bits 的概念，以原生 CSS／JS 重寫，不用 React）
     ========================================================= */

  /* Split Text：巨字逐字升起（整行仍維持左右交錯滑入） */
  .split .ch{ display:inline-block; animation:charUp .9s var(--ease) both; animation-delay:calc(var(--d0, 0s) + var(--i) * 45ms); }
  @keyframes charUp{ from{ transform:translateY(105%); opacity:0; } to{ transform:none; opacity:1; } }

  /* Blur Text：中文標題由模糊到清晰 */
  .blur-in{ animation:blurIn .9s var(--ease) both; animation-delay:var(--d, .1s); }
  @keyframes blurIn{ from{ opacity:0; filter:blur(10px); transform:translateY(6px); } to{ opacity:1; filter:none; transform:none; } }

  /* 滑動指示器：分段按鈕、行前頁籤、Dock 的選取底色會滑到新位置 */
  .slider:not(.navbar){ position:relative; }
  .slider{ isolation:isolate; }
  .slider > .pill{ position:absolute; z-index:-1; top:0; left:0; width:0; height:0; border-radius:999px; background:var(--fg);
                   transition:transform .45s var(--ease), width .45s var(--ease), height .45s var(--ease), background-color .4s ease; }
  .slider.ready .prep-tab.active{ background:transparent; }
  .navbar > .pill{ background:var(--dock-fg); }
  .navbar.ready .nav-btn.active{ background:transparent; }
  .slider:not(.ready) > .pill{ display:none; }

  /* 按下回饋：手機點擊時有輕微縮放 */
  .nav-btn,.pal-opt,.prep-tab,.tab,.btn,.day-row,.transit-map-action,.prep-start,.chip,.test-btn{ -webkit-user-select:none; user-select:none; }
  .navbar .nav-btn:active,.pal-opt:active,.prep-tab:active,.tab:active,.btn:active,.transit-map-action:active,.prep-start:active,.chip:active,.test-btn:active{ transform:scale(.94); }
  .tab,.prep-tab,.btn,.transit-map-action,.prep-start{ transition:transform .2s var(--ease), background-color .25s ease, color .25s ease, border-color .25s ease; }

  /* Spotlight Card：滑鼠移動時卡片出現柔和光暈（只在有滑鼠的裝置） */
  @media (hover:hover) and (pointer:fine){
    .spot{ position:relative; isolation:isolate; overflow:hidden; }
    .spot::after{ content:""; position:absolute; inset:0; z-index:-1; pointer-events:none; opacity:0; transition:opacity .35s ease;
                  background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%), color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%); }
    .now-card.spot::after{ background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%), color-mix(in srgb, var(--now-accent) 20%, transparent), transparent 70%); }
    .spot:hover::after{ opacity:1; }
  }

  /* 切換配色／模式：支援的瀏覽器以圓形擴散轉場 */
  ::view-transition-old(root),::view-transition-new(root){ animation:none; mix-blend-mode:normal; }

  @media (prefers-reduced-motion: reduce){
    .split .ch{ opacity:1; transform:none; }
    .blur-in{ opacity:1; filter:none; transform:none; }
  }

  /* =========================================================
     第二輪：更多操作與轉場動畫
     ========================================================= */

  /* 換頁：依選單方向從左或右滑入，頁面內的區塊依序出現 */
  .page.active{ animation:none; }
  .page.active > *{ animation:stagIn .65s var(--ease) both; animation-delay:calc(var(--k, 0) * 55ms); }
  .page.active.from-r > *{ --sx:28px; }
  .page.active.from-l > *{ --sx:-28px; }
  @keyframes stagIn{ from{ opacity:0; transform:translate(var(--sx, 0px), 14px); } to{ opacity:1; transform:none; } }
  .page.active > *:nth-child(2){ --k:1 } .page.active > *:nth-child(3){ --k:2 } .page.active > *:nth-child(4){ --k:3 }
  .page.active > *:nth-child(5){ --k:4 } .page.active > *:nth-child(6){ --k:5 } .page.active > *:nth-child(7){ --k:6 }

  /* 列表逐列出現：首頁行程、時間軸、匯率結果、行李分類 */
  .stagger > *{ animation:rowIn .6s var(--ease) both; animation-delay:calc(var(--r, 0) * 40ms + var(--r0, 0ms)); }
  .stagger.from-r > *{ --sx:36px; } .stagger.from-l > *{ --sx:-36px; }
  @keyframes rowIn{ from{ opacity:0; transform:translate(var(--sx, 0px), 10px); } to{ opacity:1; transform:none; } }
  /* 列表已由 stagger 處理，不再另外做捲動淡入 */
  .stagger > .reveal{ opacity:1; transform:none; }

  /* Dock：切換時圖示彈一下 */
  .navbar .nav-btn.active svg{ animation:pop .5s var(--ease); }
  @keyframes pop{ 0%{ transform:scale(.7); } 60%{ transform:scale(1.15); } 100%{ transform:none; } }

  /* 時間軸展開：內容淡入，目前行程的時間用強調色 */
  .t-row.open .t-detail-inner > *{ animation:rowIn .45s var(--ease) both; }
  .t-row.open .t-detail-inner > *:nth-child(2){ animation-delay:.04s } .t-row.open .t-detail-inner > *:nth-child(3){ animation-delay:.08s }
  .t-row.open .t-detail-inner > *:nth-child(4){ animation-delay:.12s } .t-row.open .t-detail-inner > *:nth-child(n+5){ animation-delay:.16s }
  .t-row:has(.t-dot.current) .t-time{ color:var(--accent); }
  .t-row{ transition:background-color .25s ease; }
  @media (hover:hover){ .t-row:hover{ background:color-mix(in srgb, var(--fg) 4%, transparent); } }
  .day-row:active{ transform:scale(.985); }
  .day-row{ transition:background-color .3s ease, color .3s ease, padding .3s var(--ease), transform .2s var(--ease); }

  /* 勾選：打勾時圓點彈一下 */
  .prep-check input:checked{ animation:pop .4s var(--ease); }
  .prep-check span{ transition:color .3s ease; }

  /* NOW 卡片進度條第一次由 0 長出來 */
  .now-bar .fill{ animation:grow 1.2s var(--ease) .3s both; transform-origin:left; }
  @keyframes grow{ from{ transform:scaleX(0); } to{ transform:none; } }
  .now-card > *{ animation:rowIn .55s var(--ease) both; }
  .now-card > *:nth-child(2){ animation-delay:.05s } .now-card > *:nth-child(3){ animation-delay:.1s }
  .now-card > *:nth-child(4){ animation-delay:.15s } .now-card > *:nth-child(n+5){ animation-delay:.2s }
  .now-card.quiet > *,.now-card.quiet .fill{ animation:none; }

  /* 全螢幕地圖：開啟時由小放大 */
  .transit-lightbox.open{ animation:fadeIn .3s ease both; }
  .transit-lightbox.open .transit-map-viewport{ animation:zoomIn .5s var(--ease) both; }
  .transit-lightbox.open .transit-lightbox-head{ animation:rowIn .45s var(--ease) .05s both; }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes zoomIn{ from{ opacity:0; transform:scale(.92); } to{ opacity:1; transform:none; } }
  .transit-lightbox-image{ transition:transform .25s var(--ease); }
  .transit-map-viewport.dragging .transit-lightbox-image{ transition:none; }
  .transit-map-frame{ cursor:zoom-in; }
  .transit-map-frame img{ transition:transform .6s var(--ease); }
  @media (hover:hover){ .transit-map-frame:hover img{ transform:scale(1.03); } }

  /* 模擬時間面板：背景變暗 */
  .sheet-backdrop{ position:fixed; inset:0; z-index:65; background:rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:opacity .3s ease; }
  .sheet-backdrop.show{ opacity:1; pointer-events:auto; }

  /* 巨字隨捲動左右錯開（Scroll Velocity 的簡化版） */
  .big > span{ will-change:transform; }
  /* 往下捲時，巨字一行往左、一行往右滑出畫面 */
  .hero .big{ --p:0; --dir:-1; }
  .hero .big:nth-child(even){ --dir:1; }
  .hero .big > span{ translate:calc(var(--dir) * var(--p) * 105%) 0; opacity:calc(1 - var(--p) * .85); }
  .hero-sub,.trip-progress{ transition:none; }

  @media (prefers-reduced-motion: reduce){
    .hero .big > span{ translate:none; opacity:1; }
  }

  /* 路線箭頭用強調色，讓長串地名有節奏 */
  .arr{ font-style:normal; color:var(--accent); margin:0 .15em; display:inline-block; transition:transform .3s var(--ease); }
  @media (hover:hover){ .day-row:hover .arr{ color:var(--bg); transform:translateX(2px); } }
  .now-card .arr{ color:var(--now-accent); }

  /* =========================================================
     第三輪：行程換日轉場、日期頁籤滑塊、時間軸連線
     ========================================================= */
  /* 日期頁籤：選取底色滑到新的日期 */
  .tabs.slider{ position:relative; }
  .tabs > .pill{ border-radius:12px; background:var(--fg); }
  .tabs.ready .tab.active{ background:transparent; }
  .tab{ position:relative; }

  /* 換日：舊的內容往反方向滑走，新的再滑進來 */
  .timeline.leave-l,#day-extra.leave-l{ animation:outL .22s ease-in both; }
  .timeline.leave-r,#day-extra.leave-r{ animation:outR .22s ease-in both; }
  @keyframes outL{ to{ opacity:0; transform:translateX(-40px); } }
  @keyframes outR{ to{ opacity:0; transform:translateX(40px); } }
  .ph-big.out .ch{ animation:charOut .22s ease-in both; animation-delay:calc(var(--i) * 12ms); }
  @keyframes charOut{ to{ transform:translateY(-100%); opacity:0; } }
  .ph-zh.swap,.ph-tag.swap{ animation:blurIn .6s var(--ease) both; }

  /* 時間軸：左側一條連線，進場時由上往下畫出來 */
  .timeline::before{ content:""; position:absolute; left:67.5px; top:22px; bottom:22px; width:1px; background:var(--line); transform-origin:top; }
  .timeline.stagger::before{ animation:drawY 1s var(--ease) .1s both; }
  @keyframes drawY{ from{ transform:scaleY(0); } to{ transform:none; } }
  .t-dot{ position:relative; box-shadow:0 0 0 4px var(--bg); }
  .t-dot.current{ box-shadow:0 0 0 4px var(--bg), 0 0 0 7px color-mix(in srgb, var(--accent) 30%, transparent); }
  .timeline:has(.empty-day)::before{ display:none; }

  /* 行李全部勾完：完成字樣彈出 */
  .prep-packing-complete{ animation:pop .6s var(--ease) both; }

  /* 匯率輸入框：聚焦時外框亮起 */
  .exchange-input,.exchange-select{ transition:border-color .25s ease, box-shadow .25s ease; }
  .exchange-input:focus{ box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
  @media (prefers-reduced-motion: reduce){ .timeline::before{ transform:none; } }

  /* =========================================================
     密碼畫面：只有「輸入密碼」、四個圓點、數字鍵
     ========================================================= */
  .lock{ position:fixed; inset:0; z-index:200; overflow-y:auto; background:var(--bg); color:var(--fg); display:flex;
         padding:max(18px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
         clip-path:inset(0 0 0 0); transition:clip-path .9s cubic-bezier(.76,0,.24,1); }
  .lock.leave{ clip-path:inset(0 0 100% 0); pointer-events:none; }
  .lock-in{ margin:auto; display:flex; flex-direction:column; align-items:center; gap:28px; }
  .lock-title{ font-size:24px; letter-spacing:.12em; min-height:1.5em; text-align:center; animation:blurIn .9s var(--ease) .1s both; transition:opacity .3s ease; }
  .lock-dots{ display:flex; gap:18px; height:16px; align-items:center; transition:opacity .4s ease; animation:fadeUp .7s var(--ease) .2s both; }
  .lock-dots i{ width:13px; height:13px; border-radius:50%; border:1.5px solid var(--fg); transition:background-color .2s ease, transform .35s var(--ease), border-color .2s ease; }
  .lock-dots i.on{ background:var(--fg); transform:scale(1.2); }
  .lock.ok .lock-dots i{ background:var(--accent); border-color:var(--accent); transform:scale(1.35); }
  .lock.bad .lock-dots{ animation:shake .45s cubic-bezier(.36,.07,.19,.97); }
  .lock.bad .lock-dots i{ border-color:var(--accent); }
  @keyframes shake{ 20%,60%{ transform:translateX(-10px); } 40%,80%{ transform:translateX(10px); } }
  .keypad{ display:grid; grid-template-columns:repeat(3,74px); gap:16px 24px; justify-content:center; transition:opacity .6s ease; }
  .key{ width:74px; height:74px; border-radius:50%; border:1px solid var(--line); font-family:var(--f-big); font-size:30px; letter-spacing:.02em;
        display:grid; place-items:center; transition:transform .15s var(--ease), background-color .2s ease, color .2s ease, border-color .2s ease;
        animation:keyIn .6s var(--ease) both; animation-delay:calc(.25s + var(--r) * 35ms); }
  @keyframes keyIn{ from{ opacity:0; transform:translateY(16px) scale(.85); } to{ opacity:1; transform:none; } }
  .key:active{ transform:scale(.88); background:var(--fg); color:var(--bg); }
  @media (hover:hover){ .key:hover{ border-color:var(--fg); } }
  .key.fn{ border-color:transparent; }
  .key.fn svg{ width:26px; height:26px; }
  .key.blank{ visibility:hidden; }
  .lock.busy .keypad{ opacity:.35; pointer-events:none; }
  /* 鎖定：數字鍵看起來停用，但仍然收得到輸入 */
  .lock.locked .lock-dots{ opacity:0; }
  .lock.locked .keypad{ opacity:.18; }
  .lock.locked .key:active{ background:transparent; color:inherit; transform:scale(.95); }
  /* 解鎖成功：數字鍵依序散開，畫面由下往上收起 */
  .lock.ok .key{ animation:keyOut .45s ease-in both; animation-delay:calc(var(--r) * 18ms); }
  @keyframes keyOut{ to{ opacity:0; transform:translateY(-14px) scale(.8); } }
  .lock.ok .lock-title{ animation:none; }
  @media (max-height:640px){ .keypad{ grid-template-columns:repeat(3,62px); gap:12px 22px; } .key{ width:62px; height:62px; font-size:26px; } .lock-in{ gap:20px; } }
  @media (prefers-reduced-motion: reduce){ .lock{ transition:opacity .2s ease; } .lock.leave{ clip-path:none; opacity:0; } }
</style>

const MAX_TRIES=3, KEY_STORE="trip_key_v2", TRY_STORE="trip_tries_v2";
const lockEl=document.getElementById("lock"), titleEl=document.getElementById("lock-title");
const dots=[...document.querySelectorAll(".lock-dots i")];
let code="", busy=false, titleTimer=0;

const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const tob64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
function store(k,v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,JSON.stringify(v)); }catch(_){} }
function load(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(_){ return null; } }
let fails=Number(load(TRY_STORE))||0;
const isLocked=()=>fails>=MAX_TRIES;

/* 用密碼解開「內容金鑰」：PBKDF2 刻意算很久，讓亂猜變慢 */
async function unwrap(pass,slot){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const kek=await crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(slot.salt),iterations:LOCK.iter,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(slot.iv)},kek,unb64(slot.key));
}
/* 用內容金鑰解密網站，放進頁面並依序執行裡面的程式 */
async function mount(rawKey){
  const key=await crypto.subtle.importKey("raw",rawKey,{name:"AES-GCM"},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(LOCK.iv)},key,unb64(LOCK.data));
  const tpl=document.createElement("template");
  tpl.innerHTML=new TextDecoder().decode(plain);
  [...tpl.content.childNodes].forEach(node=>{
    if(node.nodeName==="SCRIPT"){ const s=document.createElement("script"); s.textContent=node.textContent; document.body.insertBefore(s,lockEl); }
    else document.body.insertBefore(node,lockEl);
  });
}
function paint(){ dots.forEach((d,i)=>d.classList.toggle("on",i<code.length)); }
function setTitle(text,revertMs){
  clearTimeout(titleTimer);
  titleEl.textContent=text;
  titleEl.style.animation="none"; void titleEl.offsetWidth; titleEl.style.animation="";
  if(revertMs) titleTimer=setTimeout(()=>setTitle(isLocked()?"試太多次，鎖起來了":"輸入密碼"),revertMs);
}
function showLocked(){
  lockEl.classList.add("locked");
  setTitle("試太多次，鎖起來了");
}
async function enter(rawKey){
  await mount(rawKey);
  store(KEY_STORE,tob64(rawKey));
  fails=0; store(TRY_STORE,null);
  lockEl.classList.remove("locked","bad");
  lockEl.classList.add("ok");
  setTimeout(()=>{ lockEl.classList.add("leave"); setTimeout(()=>lockEl.remove(),950); },420);
}
async function submit(){
  busy=true; lockEl.classList.add("busy");
  try{
    await enter(await unwrap(code,LOCK.slots.main));
  }catch(_){
    fails++; store(TRY_STORE,fails);
    lockEl.classList.remove("bad"); void lockEl.offsetWidth; lockEl.classList.add("bad");
    navigator.vibrate?.(120);
    code=""; setTimeout(paint,260);
    if(isLocked()) setTimeout(showLocked,500);
    else setTitle(`密碼不對，還有 ${MAX_TRIES-fails} 次`,1800);
  }
  busy=false; lockEl.classList.remove("busy");
}
/* 鎖住時：不顯示任何輸入，湊滿 6 碼就默默試一次，不對就默默清掉 */
async function quietTry(){
  const attempt=code; code="";
  try{ await enter(await unwrap(attempt,LOCK.slots.admin)); }catch(_){}
}
function press(v){
  if(busy) return;
  if(isLocked()){
    if(v==="back"){ code=code.slice(0,-1); return; }
    code+=v;
    clearTimeout(press.idle);
    press.idle=setTimeout(()=>{ code=""; },2500);     // 停頓 2.5 秒就重新開始
    if(code.length===6) quietTry();
    return;
  }
  if(v==="back") code=code.slice(0,-1);
  else if(code.length<4) code+=v;
  lockEl.classList.remove("bad");
  paint();
  if(code.length===4) setTimeout(submit,140);
}
document.getElementById("keypad").addEventListener("click",e=>{
  const k=e.target.closest("button.key"); if(!k) return;
  press(k.dataset.fn||k.textContent.trim());
});
document.addEventListener("keydown",e=>{
  if(!document.getElementById("lock")) return;
  if(/^[0-9]$/.test(e.key)) press(e.key);
  else if(e.key==="Backspace") press("back");
});

/* 開啟時：這台裝置記住過就直接進入 */
(async function(){
  if(!window.crypto?.subtle){ setTitle("請改用 Safari 或 Chrome 開啟"); return; }
  const saved=load(KEY_STORE);
  if(saved){
    lockEl.style.visibility="hidden";     // 先不顯示密碼畫面，避免閃一下
    try{ await mount(unb64(saved)); lockEl.remove(); return; }
    catch(_){ store(KEY_STORE,null); lockEl.style.visibility=""; }   // 內容換過：改回輸入密碼
  }
  if(isLocked()) showLocked();
})();
</script>
