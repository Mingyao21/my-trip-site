<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>澳門・珠海・中山｜旅行手冊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light dark;
    --bg:#FBF7F0;
    --card:#FFFCF6;
    --border:#E6D7C2;
    --text:#3D3025;
    --text-dim:#776856;
    --accent:#BD6A40;
    --accent-soft:#F1DFC9;
    --warm:#7C8A5E;
    --warm-soft:#E9EEDD;
    --active:#BD6A40;
    --dot-idle:#C8C1B1;
    --warning:#B14E36;
    --warning-soft:#FCE9E0;
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1C1A17;
      --card:#25211C;
      --border:#453B30;
      --text:#F5EEE4;
      --text-dim:#C9BCAA;
      --accent:#C87545;
      --accent-soft:#3A2E22;
      --warm:#A8C08A;
      --warm-soft:#2B3222;
      --active:#C87545;
      --dot-idle:#6E5F49;
      --warning:#E99A75;
      --warning-soft:#3A241E;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; width:100%; overflow-x:hidden;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Noto Serif TC',serif;
    padding-bottom:70px;
  }
  .mono{ font-family:'Noto Serif TC',serif; }
  .serif{ font-family:'Noto Serif TC',serif; }

  /* header */
  header{
    padding:32px 22px 18px;
    text-align:center;
  }
  header .title{
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:27px; letter-spacing:1px;
  }
  header .dates{
    margin-top:6px; font-size:12.5px; color:var(--text-dim); font-family:'Noto Serif TC',serif; letter-spacing:.5px;
  }
  header .trip-progress{
    margin-top:4px; font-size:10.5px; color:var(--text-dim); letter-spacing:1.5px;
    text-transform:uppercase; opacity:.7; font-weight:600;
  }

  .page{ display:none; padding:0 20px; }
  .page.active{ display:block; }

  .label{
    font-size:11px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase;
    margin:26px 0 12px; font-family:'Noto Serif TC',serif;
  }
  .label:first-child{ margin-top:4px; }

  /* NOW card */
  .now-wrap{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .dot{ width:7px; height:7px; border-radius:50%; }
  .dot.live{ background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .dot.idle{ background:var(--dot-idle); }
  .now-status{ font-size:14.5px; color:var(--text-dim); font-weight:500; }

  .now-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; display:flex; gap:14px; align-items:flex-start;
    box-shadow:0 1px 3px rgba(42,40,35,.04);
  }
  .now-icon{
    width:46px; height:46px; border-radius:12px; background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;
  }
  .now-title{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:19px; }
  .now-time{ font-size:14px; color:var(--accent); margin-top:3px; font-family:'Noto Serif TC',serif; font-weight:600; }
  .now-addr{ font-size:13.5px; color:var(--text-dim); margin-top:6px; line-height:1.6; }

  .next-line{
    margin-top:12px; padding-top:12px; border-top:1px solid var(--border);
    display:flex; align-items:center; gap:10px; font-size:14px; color:var(--text-dim);
  }
  .next-line .ic{ font-size:17px; }
  .next-line b{ color:var(--text); font-weight:600; }
  .now-remain{ font-size:13px; color:var(--text-dim); margin-top:10px; }
  .now-remain b{ color:var(--accent); font-weight:600; }

  .status-badge{
    display:inline-block; font-size:10px; padding:2px 7px; border-radius:6px;
    font-family:'Noto Serif TC',serif; flex-shrink:0; letter-spacing:.3px;
  }
  .status-badge.tentative{ color:var(--text-dim); background:transparent; border:1px solid var(--border); }
  .status-badge.confirmed{ color:var(--warm); background:var(--warm-soft); font-weight:600; border:1px solid transparent; }

  /* day quick nav on home */
  .day-nav{ display:flex; flex-direction:column; gap:10px; }
  .day-row{
    display:flex; align-items:center; gap:12px; padding:13px 16px;
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius); cursor:pointer;
  }
  .day-row .d{
    font-family:'Noto Serif TC',serif; font-weight:600; font-size:12px; color:var(--warm);
    background:var(--warm-soft); padding:5px 9px; border-radius:8px; flex-shrink:0;
  }
  .day-row .r{ flex:1; }
  .day-row .r .t{ font-size:15px; font-weight:600; }
  .day-row .r .s{ font-size:12.5px; color:var(--text-dim); margin-top:2px; }
  .day-row .arrow{ color:var(--text-dim); font-size:14px; }

  /* confirmed section on home */
  .confirmed-list{ display:flex; flex-direction:column; gap:10px; }
  .c-row{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; cursor:pointer;
  }
  .c-head{ display:flex; align-items:center; gap:10px; }
  .c-icon{ font-size:20px; flex-shrink:0; }
  .c-main{ flex:1; min-width:0; }
  .c-title{ font-size:14.5px; font-weight:600; }
  .c-sub{ font-size:12.5px; color:var(--text-dim); margin-top:2px; }
  .c-row.open .t-chev{ transform:rotate(90deg); }
  .c-row.open .t-detail{ max-height:800px; margin-top:12px; }

  /* itinerary tabs */
  .tabs{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:20px 0 22px; }
  .tab{
    text-align:center; padding:10px 0; border-radius:12px;
    border:1px solid var(--border); background:var(--card);
    font-size:14.5px; font-weight:600; color:var(--text-dim); cursor:pointer;
    min-width:0;
  }
  .tab.active{ background:var(--active); color:#FFF8F0; border-color:var(--active); }
  .tab .dt{ display:block; font-size:10px; font-weight:500; margin-top:2px; opacity:.75; }

  .empty-day{
    text-align:center; color:var(--text-dim); font-size:14px; padding:60px 20px;
    border:1px dashed var(--border); border-radius:var(--radius);
  }

  /* timeline */
  .timeline{ position:relative; padding-left:2px; }
  .t-row{
    display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .t-row:last-child{ border-bottom:none; }
  .t-time{ width:50px; flex-shrink:0; font-family:'Noto Serif TC',serif; font-size:14px; font-weight:600; color:var(--text-dim); padding-top:2px; }
  .t-mid{
    width:20px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; padding-top:4px;
  }
  .t-dot{ width:8px; height:8px; border-radius:50%; background:var(--border); border:2px solid var(--card); box-shadow:0 0 0 1px var(--border); }
  .t-dot.current{ background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .t-body{ flex:1; min-width:0; }
  .t-head{ display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap; min-width:0; }
  .t-icon{ font-size:19px; flex-shrink:0; font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif; }
  .t-title{ font-size:16px; font-weight:600; flex:1 1 180px; min-width:0; overflow-wrap:anywhere; word-break:break-word; }
  .t-head .status-badge,.t-head .t-tag,.t-chev{ flex:0 0 auto; }
  .t-tag{
    font-size:9.5px; letter-spacing:.5px; color:#FFF8F0; background:var(--accent);
    padding:2px 6px; border-radius:5px; font-family:'Noto Serif TC',serif;
  }
  .t-chev{ color:var(--text-dim); font-size:11px; transition:transform .18s; }
  .t-row.open .t-chev{ transform:rotate(90deg); }

  .t-detail{ max-height:0; overflow:hidden; transition:max-height .22s ease; }
  .t-row.open .t-detail{ max-height:800px; margin-top:12px; }
  .t-detail-inner{ width:100%; max-width:100%; overflow-wrap:anywhere; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; }
  .img-placeholder{
    width:100%; height:120px; border-radius:10px; background:var(--accent-soft);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:12px; gap:4px; margin-bottom:12px; border:1px dashed var(--border);
  }
  .img-placeholder .ic{ font-size:22px; }
  .d-img{
    width:100%; height:130px; object-fit:cover; border-radius:10px; margin-bottom:12px; display:block;
  }
  .d-desc{ min-width:0; overflow-wrap:anywhere; word-break:break-word; font-size:14.5px; color:var(--text-dim); line-height:1.65; margin-bottom:10px; }
  .d-line{ display:flex; gap:8px; font-size:14.5px; padding:6px 0; align-items:flex-start; }
  .d-line .k{ width:20px; flex-shrink:0; }
  .d-line .v{ flex:1; min-width:0; overflow-wrap:anywhere; word-break:break-word; }
  .d-line a.link{ color:var(--text); text-decoration:underline dotted; }
  .recs{ margin-top:4px; }
  .recs .rec-title{ font-size:11.5px; color:var(--warm); font-weight:600; margin-bottom:4px; letter-spacing:.5px;}
  .rec-item{ min-width:0; overflow-wrap:anywhere; word-break:break-word; font-size:12.5px; color:var(--text); padding:2px 0 2px 14px; position:relative; }
  .rec-item::before{ content:"·"; position:absolute; left:2px; color:var(--warm); }
  .btn-row{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn{
    flex:1 1 auto; min-width:110px; text-align:center; padding:10px; border-radius:10px; font-size:12.5px; font-weight:600;
    border:1px solid var(--border); background:var(--bg); color:var(--text); cursor:pointer;
  }
  .btn.primary{ background:var(--active); color:#FFF8F0; border-color:var(--active); }

  /* currency */
  .exchange-card,
  .exchange-result,
  .exchange-rates{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  }
  .exchange-card{ padding:16px; }
  .exchange-notice{ font-size:12.5px; color:var(--text-dim); margin-bottom:14px; }
  .exchange-inputs{ display:flex; gap:10px; }
  .exchange-input,
  .exchange-select{
    height:46px; border:1px solid var(--border); border-radius:11px; background:var(--bg); color:var(--text);
    font:600 16px 'Noto Serif TC',serif; padding:0 12px;
  }
  .exchange-input{ flex:1; min-width:0; }
  .exchange-select{ width:92px; }
  .exchange-results{ display:flex; flex-direction:column; gap:10px; }
  .exchange-result{ padding:14px 16px; }
  .exchange-result .currency-name{ font-size:12.5px; color:var(--text-dim); }
  .exchange-result .currency-value{ font-size:22px; font-weight:700; margin-top:3px; color:var(--accent); }
  .exchange-rates{ margin-top:12px; padding:13px 16px; font-size:12px; color:var(--text-dim); line-height:1.7; }

  /* bottom nav */
  .navbar{
    position:fixed; left:0; right:0; bottom:0; height:60px;
    background:var(--card); border-top:1px solid var(--border);
    display:flex; z-index:50; padding-bottom:env(safe-area-inset-bottom);
  }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; color:var(--text-dim); font-size:10.5px; background:none; border:none; cursor:pointer;
  }
  .nav-btn .ic{ font-size:18px; }
  .nav-btn.active{ color:var(--accent); font-weight:600; }

  /* test time tool */
  .test-fab{
    position:fixed; right:14px; bottom:76px; z-index:60;
    width:34px; height:34px; border-radius:50%; background:var(--card); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:14px; opacity:.55; cursor:pointer;
  }
  .test-sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:70; background:var(--card);
    border-radius:18px 18px 0 0; padding:18px 20px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(110%); transition:transform .22s ease; box-shadow:0 -6px 24px rgba(0,0,0,.1);
  }
  .test-sheet.open{ transform:translateY(0); }
  .test-title{ font-size:11.5px; letter-spacing:1.5px; color:var(--text-dim); text-transform:uppercase; margin-bottom:12px; font-family:'Noto Serif TC',serif;}
  .test-row{ display:flex; gap:8px; margin-bottom:10px; }
  .test-btn{
    flex:1; padding:9px; border-radius:10px; border:1px solid var(--border); background:var(--bg);
    font-size:13px; font-weight:600; cursor:pointer; text-align:center; color:var(--text);
  }
  .test-btn.active{ background:var(--active); color:#FFF8F0; border-color:var(--active); }
  input[type="datetime-local"]{
    width:100%; padding:10px; border-radius:10px; border:1px solid var(--border);
    font-family:'Noto Serif TC',serif; font-size:13px; background:var(--bg); margin-bottom:10px; color:var(--text);
  }
  .presets{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:4px; }
  .chip{ font-family:'Noto Serif TC',serif; font-size:11px; padding:6px 9px; background:var(--bg); border:1px solid var(--border); border-radius:8px; cursor:pointer; }
  .test-close{ text-align:center; padding-top:10px; font-size:12px; color:var(--text-dim); cursor:pointer; }

  .toast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:84px; z-index:80;
    background:var(--active); color:#FFF8F0; padding:9px 16px; border-radius:20px; font-size:13px;
    opacity:0; transition:opacity .2s; pointer-events:none;
  }
  .toast.show{ opacity:1; }

  .last-updated{
    text-align:center; font-size:10.5px; color:var(--text-dim); opacity:.55;
    margin:28px 0 12px; font-family:'Noto Serif TC',serif;
  }

  .transport-budget{
    margin-top:22px; background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px;
  }
  .transport-budget .tb-title{ font-size:13.5px; font-weight:700; color:var(--text); margin-bottom:10px; }
  .transport-budget .tb-line{
    display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:5px 0; color:var(--text-dim);
  }
  .transport-budget .tb-line .v{ color:var(--text); font-weight:600; min-width:0; text-align:right; overflow-wrap:anywhere; }
  .transport-budget .tb-total{
    margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); font-size:13.5px; color:var(--text);
  }
  .transport-budget .tb-total b{ color:var(--accent); }
  .transport-budget .tb-note{ margin-top:8px; font-size:11px; color:var(--text-dim); opacity:.8; line-height:1.5; }
  .transport-budget .tb-group{ font-size:12px; font-weight:600; color:var(--text-dim); margin:10px 0 4px; letter-spacing:.3px; }
  .travel-warning{
    margin-top:22px; background:var(--warning-soft); border:1px solid var(--warning);
    border-radius:var(--radius); padding:16px;
  }
  .travel-warning .tw-title{ font-size:13.5px; font-weight:700; color:var(--warning); margin-bottom:8px; }
  .travel-warning .tw-intro,.travel-warning .tw-detail{ font-size:12px; color:var(--text); line-height:1.6; }
  .travel-warning .tw-list{ margin:7px 0; padding-left:20px; font-size:12px; color:var(--text); line-height:1.65; }
  .flight-arrival-status{ margin-top:9px; font-size:12px; font-weight:600; line-height:1.5; }
  .flight-arrival-status.safe{ color:var(--warm); }
  .flight-arrival-status.late{ color:var(--warning); }
</style>
</head>
<body>

<header>
  <div class="title serif">澳門・珠海・中山</div>
  <div class="dates">2026.11.25 — 2026.11.30　SOLO TRIP</div>
  <div class="trip-progress" id="trip-progress"></div>
</header>

<!-- ============ HOME ============ -->
<div class="page active" id="page-home">
  <div class="label">NOW｜現在</div>
  <div class="now-wrap"><span class="dot" id="now-dot"></span><span class="now-status" id="now-status">—</span></div>
  <div class="now-card" id="now-card"></div>

  <div class="label">CONFIRMED｜已確認</div>
  <div class="confirmed-list" id="confirmed-list"></div>

  <div class="label">行程</div>
  <div class="day-nav" id="day-nav"></div>

  <div class="last-updated" id="last-updated-home"></div>
</div>

<!-- ============ ITINERARY ============ -->
<div class="page" id="page-itinerary">
  <div class="tabs" id="tabs"></div>
  <div class="timeline" id="timeline"></div>
  <div id="day-extra"></div>
  <div class="last-updated" id="last-updated-itin"></div>
</div>

<!-- ============ CURRENCY ============ -->
<div class="page" id="page-exchange">
  <div class="label">EXCHANGE｜匯率換算</div>
  <div class="exchange-card">
    <div class="exchange-notice">目前使用手動設定匯率</div>
    <div class="exchange-inputs">
      <input class="exchange-input" id="currency-amount" type="number" min="0" step="any" value="100" inputmode="decimal" aria-label="金額">
      <select class="exchange-select" id="currency-from" aria-label="原始幣別">
        <option value="CNY">CNY</option>
        <option value="TWD">TWD</option>
        <option value="MOP">MOP</option>
      </select>
    </div>
  </div>

  <div class="label">換算結果</div>
  <div class="exchange-results" id="currency-results"></div>
  <div class="exchange-rates" id="currency-rates"></div>
</div>

<div class="navbar">
  <button class="nav-btn active" data-page="home"><span class="ic">🏠</span>首頁</button>
  <button class="nav-btn" data-page="itinerary"><span class="ic">🗓️</span>行程</button>
  <button class="nav-btn" data-page="exchange"><span class="ic">💱</span>匯率</button>
</div>

<div class="test-fab" id="test-fab">🧪</div>
<div class="test-sheet" id="test-sheet">
  <div class="test-title">測試時間</div>
  <div class="test-row">
    <div class="test-btn active" id="btn-real">使用目前時間</div>
    <div class="test-btn" id="btn-sim">模擬時間</div>
  </div>
  <input type="datetime-local" id="sim-input">
  <div class="presets" id="presets"></div>
  <div class="test-close" id="test-close">關閉</div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ================================
   TRIP DATA｜旅行資料
   未來主要只修改這裡
   ================================

   - 修改或新增行程，只需要編輯下面的 TRIP 物件
   - 不需要更動任何 render function 或 HTML
   - 每一天（day）固定格式：{ date, label, dateLabel, route, items }
   - 每一個行程（item）固定支援以下欄位，沒有資料請填 null：
       s            開始時間 "HH:mm"
       e            結束時間 "HH:mm"
       title        行程名稱
       type         類型（餐廳／景點／交通／購物／住宿…）
       icon         emoji icon
       desc         簡短說明
       address      地址
       price        費用
       transport    交通方式／班次
       phone        電話
       status       "confirmed" 或 "tentative"
       imageUrl     圖片網址（null 時顯示 placeholder）
       websiteUrl   官方網站
       mapUrl       導航連結
       bookingUrl   訂票／訂房連結
       note         備註

   // 新增行程範例（僅供參考，不會顯示在網站上）：
   // {
   //   s:"10:00", e:"11:30",
   //   title:"景點名稱",
   //   type:"景點",
   //   icon:"📍",
   //   desc:null,
   //   address:null,
   //   price:null,
   //   transport:null,
   //   phone:null,
   //   status:"tentative",
   //   imageUrl:null,
   //   websiteUrl:null,
   //   mapUrl:null,
   //   bookingUrl:null,
   //   note:null
   // }
   ========================================================= */
const DEFAULT_TRIP = {
  lastUpdated: "2026-08-21T06:00:00",

  flights: [
    { type:"outbound", airline:"STARLUX 星宇航空", flightNo:"JX201", date:"2026-11-25",
      fromCity:"台北", fromAirport:"桃園國際機場", fromCode:"TPE",
      toCity:"澳門", toAirport:"澳門國際機場", toCode:"MFM",
      depart:"07:45", arrive:"09:45", duration:"2 小時", direct:true,
      terminal:null, gate:null, seat:null, baggage:null,
      bookingReference:null, bookingUrl:null, status:"confirmed", note:null },
    { type:"return", airline:"STARLUX 星宇航空", flightNo:"JX206", date:"2026-11-30",
      fromCity:"澳門", fromAirport:"澳門國際機場", fromCode:"MFM",
      toCity:"台北", toAirport:"桃園國際機場", toCode:"TPE",
      depart:"20:35", arrive:"22:25", duration:"1 小時 50 分", direct:true,
      terminal:null, gate:null, seat:null, baggage:null,
      bookingReference:null, bookingUrl:null, status:"confirmed", note:null }

/* TRIP 目前指向的資料來源：預設為內建資料（DEFAULT_TRIP）
   若 Supabase 讀取成功，會在 initTrip() 中被換成雲端資料 */
let TRIP = DEFAULT_TRIP;

/* time utils */
/* 只接受合法的 "YYYY-MM-DD" + "HH:mm"，其他情況回傳 null（不會產生 Invalid Date） */
function toDate(dateStr,timeStr){
  if(!dateStr || !timeStr) return null;
  const dm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr);
  const tm = /^(\d{2}):(\d{2})$/.exec(timeStr);
  if(!dm || !tm) return null;
  const d = new Date(Number(dm[1]), Number(dm[2])-1, Number(dm[3]), Number(tm[1]), Number(tm[2]), 0, 0);
  return isNaN(d.getTime()) ? null : d;
}
let FLAT=[];
function buildFlat(){
  FLAT=[];
  TRIP.days.forEach((day,dayIdx)=>{
    if(!day.date || !Array.isArray(day.items) || day.items.length===0) return; // 待安排／空白的一天，NOW 不處理
    day.items.forEach((it,itemIdx)=>{
      let start=toDate(day.date,it.s), end=toDate(day.date,it.e);
      if(!start || !end) return; // 缺少有效 start/end，略過，不加入 NOW 判斷
      if(end<=start) end=new Date(end.getTime()+24*60*60*1000);
      FLAT.push({...it,dayIdx,itemIdx,dayLabel:day.label,start,end});
    });
  });
  FLAT.sort((a,b)=>a.start-b.start);
}
buildFlat();

/* =========================================================
   ================================
   SUPABASE 讀取架構｜V4-A2
   只使用 anon key 讀取（select），不做寫入、不做登入。
   成功 → 用雲端資料覆蓋 TRIP；失敗／未設定 → 維持 DEFAULT_TRIP。
   ================================
   ========================================================= */
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

function supabaseConfigured(){
  return !!SUPABASE_URL && !!SUPABASE_ANON_KEY &&
    SUPABASE_URL.indexOf("YOUR_SUPABASE_URL")===-1 &&
    SUPABASE_ANON_KEY.indexOf("YOUR_SUPABASE_ANON_KEY")===-1;
}

async function sbGet(path){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers:{
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY
    }
  });
  if(!res.ok) throw new Error(`Supabase 讀取失敗：${path}（${res.status}）`);
  return res.json();
}

/* "HH:mm:ss" 或 "HH:mm" → "HH:mm"；空值回傳 null */
function sbTime(t){ return t ? String(t).slice(0,5) : null; }

/* 將 Supabase 回傳的 rows 轉換成目前網站使用的 TRIP 結構
   （TRIP.days / TRIP.stays / TRIP.flights），
   欄位命名對應現有 render function 所預期的 camelCase 欄位。 */
function mapSupabaseToTrip(trip, dayRows, itemRows, stayRows, flightRows){
  const dayIndexById = {};
  dayRows.forEach(d=> dayIndexById[d.id] = d.day_index);

  const days = dayRows
    .slice()
    .sort((a,b)=>a.day_index-b.day_index)
    .map(d=>{
      const fallbackDay = DEFAULT_TRIP.days.find(x=>x.date===d.date);
      const items = itemRows
        .filter(it=>it.day_id===d.id)
        .slice()
        .sort((a,b)=>(a.sort_order??0)-(b.sort_order??0))
        .map(it=>({
          s: sbTime(it.start_time),
          e: sbTime(it.end_time),
          title: it.title,
          type: it.type,
          icon: it.icon,
          desc: it.description,
          address: it.address,
          price: it.price,
          transport: it.transport,
          phone: it.phone,
          status: it.status,
          imageUrl: it.image_url,
          websiteUrl: it.website_url,
          mapUrl: it.map_url,
          bookingUrl: it.booking_url,
          note: it.note,
          image: !!it.image_url
        }));
      return {
        date: d.date,
        label: d.label,
        dateLabel: d.date_label,
        route: d.route,
        theme: fallbackDay?.theme ?? null,
        hint: fallbackDay?.hint ?? null,
        transportBudget: fallbackDay?.transportBudget ?? null,
        dayBudget: fallbackDay?.dayBudget ?? null,
        arrivalNotice: fallbackDay?.arrivalNotice ?? null,
        airportArrivalTime: fallbackDay?.airportArrivalTime ?? null,
        items
      };
    });

  const stays = stayRows.map(s=>({
    day: s.day_id ? (dayIndexById[s.day_id] ?? null) : null,
    city: s.city,
    hotelName: s.hotel_name,
    checkIn: s.check_in,
    checkOut: s.check_out,
    address: s.address,
    phone: s.phone,
    imageUrl: s.image_url,
    websiteUrl: s.website_url,
    bookingUrl: s.booking_url,
    mapUrl: s.map_url,
    note: s.note,
    status: s.status
  }));

  const flights = flightRows.map(f=>({
    type: f.type,
    airline: f.airline,
    flightNo: f.flight_no,
    date: f.date,
    fromCity: f.from_city,
    fromAirport: f.from_airport,
    fromCode: f.from_code,
    toCity: f.to_city,
    toAirport: f.to_airport,
    toCode: f.to_code,
    depart: sbTime(f.depart_time),
    arrive: sbTime(f.arrive_time),
    duration: f.duration,
    direct: f.direct,
    terminal: f.terminal,
    gate: f.gate,
    seat: f.seat,
    baggage: f.baggage,
    bookingReference: f.booking_reference,
    bookingUrl: f.booking_url,
    status: f.status,
    note: f.note
  }));

  // lastUpdated 直接採用 Supabase trips 資料表的 updated_at 欄位（timestamptz）。
  // 未來任何資料異動（景點/時間/地址/備註/住宿/交通/照片新增或刪除）
  // 只要在後端寫入時同步更新 trips.updated_at，這裡就會自動反映最新時間，
  // 不需要另外修改這段前端邏輯。
  return { lastUpdated: trip.updated_at, flights, stays, days };
}

/* 嘗試從 Supabase 讀取整趟旅行資料；任何一步失敗都會 throw，
   由呼叫端 catch 並 fallback 回 DEFAULT_TRIP */
async function loadFromSupabase(){
  if(!supabaseConfigured()) return null; // 尚未設定，直接跳過、不發送請求

  const trips = await sbGet(`trips?select=*&is_public=eq.true&order=created_at.desc&limit=1`);
  const trip = trips && trips[0];
  if(!trip) throw new Error("找不到公開的旅行資料");

  const dayRows = await sbGet(`days?select=*&trip_id=eq.${trip.id}&order=day_index.asc`);
  if(!dayRows || dayRows.length===0) throw new Error("找不到 days 資料");

  const dayIds = dayRows.map(d=>d.id);
  const itemRows = dayIds.length
    ? await sbGet(`itinerary_items?select=*&day_id=in.(${dayIds.join(",")})&order=sort_order.asc`)
    : [];

  const stayRows = await sbGet(`stays?select=*&trip_id=eq.${trip.id}&order=check_in.asc`);
  const flightRows = await sbGet(`flights?select=*&trip_id=eq.${trip.id}`);

  return mapSupabaseToTrip(trip, dayRows, itemRows, stayRows, flightRows);
}

const state={ page:"home", day:1, openId:null, openConfirmed:null, simTime:null };
function getNow(){ return state.simTime ? new Date(state.simTime) : new Date(); }
function computeStatus(now){
  let current=null,next=null;
  for(const it of FLAT){ if(now>=it.start && now<it.end) current=it; }
  for(const it of FLAT){ if(it.start>now){ next=it; break; } }
  return {current,next};
}
function esc(s){ return (s||"").replace(/'/g,"\\'"); }
function copyText(t){ navigator.clipboard?.writeText(t).then(()=>showToast("已複製地址 📋")).catch(()=>showToast("複製失敗")); }
function callPhone(n){ window.location.href="tel:"+n.replace(/[^0-9+]/g,""); }
function openMap(addr){ window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(addr),"_blank"); }
function showToast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }

/* ---- 匯率：手動設定，均以 1 單位幣別可兌換的 CNY 表示 ---- */
const MANUAL_CURRENCY_RATES = { CNY:1, TWD:1/4.5, MOP:1/1.1 };
const CURRENCY_NAMES = { CNY:"人民幣 CNY", TWD:"新台幣 TWD", MOP:"澳門幣 MOP" };
function convertCurrency(amount,fromCurrency,toCurrency){
  const value=Number(amount);
  if(!Number.isFinite(value) || value<0 || !MANUAL_CURRENCY_RATES[fromCurrency] || !MANUAL_CURRENCY_RATES[toCurrency]) return null;
  return value*MANUAL_CURRENCY_RATES[fromCurrency]/MANUAL_CURRENCY_RATES[toCurrency];
}
function formatCurrency(currency,value){
  if(value==null) return "—";
  return `${currency} ${value.toLocaleString("zh-TW",{maximumFractionDigits:2})}`;
}
function renderExchange(){
  const amountInput=document.getElementById("currency-amount");
  const fromSelect=document.getElementById("currency-from");
  const results=document.getElementById("currency-results");
  const rates=document.getElementById("currency-rates");
  if(!amountInput || !fromSelect || !results || !rates) return;
  const rawAmount=amountInput.value.trim();
  const amount=Number(rawAmount);
  const valid=rawAmount!=="" && Number.isFinite(amount) && amount>=0;
  const from=fromSelect.value;
  const targets=Object.keys(MANUAL_CURRENCY_RATES).filter(currency=>currency!==from);
  results.innerHTML=valid
    ? targets.map(currency=>`<div class="exchange-result"><div class="currency-name">${CURRENCY_NAMES[currency]}</div><div class="currency-value">${formatCurrency(currency,convertCurrency(amount,from,currency))}</div></div>`).join("")
    : '<div class="exchange-result"><div class="currency-name">請輸入有效金額</div></div>';
  rates.textContent="目前使用手動設定匯率｜1 CNY = 4.50 TWD｜1 CNY = 1.10 MOP";
}

/* 剩餘時間文字：不顯示小數或秒數 */
function formatRemaining(ms){
  let totalMin = Math.max(1, Math.round(ms/60000));
  const h = Math.floor(totalMin/60), m = totalMin%60;
  if(h<=0) return `${m} 分鐘`;
  if(m===0) return `${h} 小時`;
  return `${h} 小時 ${m} 分鐘`;
}
/* 下一個行程的時間顯示：跨日時附上日期 */
function formatNextWhen(item, now){
  const sameDay = item.start.getFullYear()===now.getFullYear() && item.start.getMonth()===now.getMonth() && item.start.getDate()===now.getDate();
  return sameDay ? item.s : `${item.start.getMonth()+1}/${item.start.getDate()}（${item.s}）`;
}
/* 找出 now 所在日曆日期對應的 TRIP.days 項目（依 date 欄位比對年月日） */
function findDayForDate(now){
  return TRIP.days.find(d=>{
    if(!d.date) return false;
    const [y,m,dd]=d.date.split("-").map(Number);
    return now.getFullYear()===y && (now.getMonth()+1)===m && now.getDate()===dd;
  });
}
/* 找出 now 屬於旅行第幾天（1-based），不屬於旅行期間則回傳 null */
function getTripDayIndex(now){
  for(let i=0;i<TRIP.days.length;i++){
    const d=TRIP.days[i];
    if(!d.date) continue;
    const [y,m,dd]=d.date.split("-").map(Number);
    if(now.getFullYear()===y && (now.getMonth()+1)===m && now.getDate()===dd) return i+1;
  }
  return null;
}

/* ---- render trip progress (header) ---- */
function renderTripProgress(){
  const el=document.getElementById("trip-progress");
  if(!el) return;
  const now=getNow();
  const before = FLAT[0] && now < FLAT[0].start;
  const after = FLAT.length && now >= FLAT[FLAT.length-1].end;
  if(before || after){
    el.textContent = "6 DAYS · 5 NIGHTS";
  } else {
    const dayIdx = getTripDayIndex(now);
    el.textContent = dayIdx ? `DAY ${dayIdx} OF 6` : "6 DAYS · 5 NIGHTS";
  }
}

/* ---- render NOW ---- */
function renderNow(){
  const now=getNow();
  const {current,next}=computeStatus(now);
  const dotEl=document.getElementById("now-dot");
  const statusEl=document.getElementById("now-status");
  const card=document.getElementById("now-card");

  if(current){
    dotEl.className="dot live";
    statusEl.textContent="現在正在進行";
    const remain = formatRemaining(current.end - now);
    const tag = current.status==="confirmed" ? `<span class="status-badge confirmed">✓ 已確認</span>` : `<span class="status-badge tentative">暫定</span>`;
    card.innerHTML=`
      <div class="now-icon">${current.icon}</div>
      <div style="flex:1; min-width:0">
        <div class="now-title serif">${current.title}</div>
        <div class="now-time mono">${current.s} – ${current.e}</div>
        <div style="margin-top:6px">${tag}</div>
        <div class="now-addr">📍 ${current.address||"—"}</div>
        <div class="now-remain">距離本行程結束還有 <b>${remain}</b></div>
        ${next?`<div class="next-line"><span class="ic">${next.icon}</span><span>下一站：<b>${next.title}</b>　${next.s}</span></div>`:""}
      </div>`;
  } else {
    dotEl.className="dot idle";
    const before = FLAT[0] && now < FLAT[0].start;
    const after = FLAT.length && now >= FLAT[FLAT.length-1].end;
    const todayDay = findDayForDate(now);
    const noScheduleToday = !before && !after && todayDay && (!todayDay.items || todayDay.items.length===0);

    if(after){
      statusEl.textContent = "行程已結束";
      card.innerHTML = `<div style="padding:6px 2px; color:var(--text-dim); font-size:13.5px;">這趟旅程已經結束，一路順風 ✈️</div>`;
    } else if(noScheduleToday){
      statusEl.textContent = "今日尚未安排";
      const remain = next ? formatRemaining(next.start - now) : null;
      const whenStr = next ? formatNextWhen(next, now) : null;
      card.innerHTML=`
        <div class="now-icon">☕</div>
        <div style="flex:1; min-width:0">
          <div class="now-title serif">今日尚未安排詳細行程</div>
          ${next?`
            <div class="now-addr" style="margin-top:8px">下一個行程：</div>
            <div class="now-title serif" style="font-size:16px; margin-top:2px;">${next.icon} ${next.title}</div>
            <div class="now-addr" style="margin-top:6px">開始：<span class="mono">${whenStr}</span></div>
            <div class="now-remain">距離下一個行程還有 <b>${remain}</b></div>
          `:""}
        </div>`;
    } else if(next){
      statusEl.textContent = before ? "尚未出發" : "自由／緩衝時間";
      const remain = formatRemaining(next.start - now);
      const whenStr = formatNextWhen(next, now);
      card.innerHTML=`
        <div class="now-icon">☕</div>
        <div style="flex:1; min-width:0">
          <div class="now-title serif">自由／緩衝時間</div>
          <div class="now-addr" style="margin-top:8px">下一個行程：</div>
          <div class="now-title serif" style="font-size:16px; margin-top:2px;">${next.icon} ${next.title}</div>
          <div class="now-addr" style="margin-top:6px">開始：<span class="mono">${whenStr}</span></div>
          <div class="now-remain">距離下一個行程還有 <b>${remain}</b></div>
        </div>`;
    } else {
      statusEl.textContent = "尚未安排";
      card.innerHTML = `<div style="padding:6px 2px; color:var(--text-dim); font-size:13.5px;">目前沒有安排的行程。</div>`;
    }
  }
}

/* ---- 依 stay 的 checkIn/checkOut 換算住宿標題顯示用的 DAY 範圍 ---- */
function stayDayRangeLabel(h){
  const days = TRIP.days;
  const startIdx = days.findIndex(d=>d.date===h.checkIn);
  let endIdx = -1;
  if(h.checkOut){
    const co = new Date(h.checkOut+"T00:00:00");
    if(!isNaN(co.getTime())){
      co.setDate(co.getDate()-1); // 退房日的前一晚才是最後一個住宿夜晚
      const pad=n=>String(n).padStart(2,"0");
      const endDateStr = `${co.getFullYear()}-${pad(co.getMonth()+1)}-${pad(co.getDate())}`;
      endIdx = days.findIndex(d=>d.date===endDateStr);
    }
  }
  const startDay = startIdx>=0 ? startIdx+1 : h.day;
  const endDay = endIdx>=0 ? endIdx+1 : startDay;
  return startDay===endDay ? `DAY ${startDay} 住宿` : `DAY ${startDay}–${endDay} 住宿`;
}

/* ---- 將 Timeline 的住宿項目對應至同一筆住宿資料，避免重複維護飯店資訊 ---- */
function stayForTimelineItem(day,it){
  if(it.type!=="住宿") return null;
  const itemText=`${it.title||""} ${it.desc||""}`;
  const namedStay=TRIP.stays.find(h=>h.hotelName && itemText.includes(h.hotelName));
  if(namedStay) return namedStay;
  return TRIP.stays.find(h=>h.checkIn && h.checkOut && day.date>=h.checkIn && day.date<h.checkOut) || null;
}
function stayDetailLines(h,itemNote=null){
  const price=h.price==null ? "價格待補" : h.price;
  const dates=[
    h.checkIn ? `入住 ${fmtDateShort(h.checkIn)}${h.checkInTime ? ` ${h.checkInTime}` : ""}` : null,
    h.checkOut ? `退房 ${fmtDateShort(h.checkOut)}${h.checkOutTime ? ` ${h.checkOutTime}` : ""}` : null
  ].filter(Boolean).join(" · ");
  const lines=[];
  if(dates) lines.push(["🗓️",dates]);
  if(h.nights) lines.push(["🌙",h.nights]);
  lines.push(["💰",price]);
  if(h.roomType) lines.push(["🛏️",h.roomNote ? `${h.roomType}｜${h.roomNote}` : h.roomType]);
  if(h.bedType) lines.push(["🛌",h.bedType]);
  if(h.occupancy) lines.push(["👥",h.occupancy]);
  if(h.area) lines.push(["📐",h.area]);
  if(h.view) lines.push(["🏙️",h.view]);
  if(h.floor) lines.push(["🏢",h.floor]);
  if(h.features) lines.push(["🪟",h.features]);
  if(h.breakfast) lines.push(["🍳",h.breakfast]);
  if(h.address) lines.push(["📍",h.address]);
  if(h.phone) lines.push(["☎️",h.phone]);
  if(h.note) lines.push(["📝",h.note]);
  if(itemNote && itemNote!==h.note) lines.push(["📝",itemNote]);
  return lines.map(([icon,value])=>`<div class="d-line"><span class="k">${icon}</span><span class="v">${value}</span></div>`).join("");
}

/* ---- last updated ---- */
function formatLastUpdated(iso){
  if(!iso) return "";
  const d=new Date(iso);
  const pad=n=>String(n).padStart(2,"0");
  return `最後更新：${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function renderLastUpdated(){
  const txt = formatLastUpdated(TRIP.lastUpdated);
  const a=document.getElementById("last-updated-home");
  const b=document.getElementById("last-updated-itin");
  if(a) a.textContent = txt;
  if(b) b.textContent = txt;
}

/* ---- render itinerary ---- */
function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML = TRIP.days.map((d,i)=>`
    <div class="tab ${state.day===i+1?'active':''}" onclick="setDay(${i+1})">${d.label}<span class="dt">${d.dateLabel}</span></div>
  `).join("");
}
function setDay(n){ state.day=n; state.openId=null; renderTabs(); renderTimeline(); }

function renderTimeline(){
  const day=TRIP.days[state.day-1];
  const now=getNow();
  const {current}=computeStatus(now);
  const el=document.getElementById("timeline");

  if(!day.items || day.items.length===0){
    el.innerHTML = `<div class="empty-day">這一天還沒有安排</div>`;
    renderDayExtra(day);
    return;
  }

  el.innerHTML = day.items.map((it,idx)=>{
    const id=`${state.day}-${idx}`;
    const isCurrent = current && current.dayIdx===state.day-1 && current.itemIdx===idx;
    const isOpen = state.openId===id;
    const stay=stayForTimelineItem(day,it);
    const detailData=stay||it;
    const itemNoteHtml=["孫文西路步行街","香山商業文化博物館","岐江公園","中懇人行天橋","興中廣場"].includes(it.title) && it.note
      ? `<div class="d-line"><span class="k">📝</span><span class="v">${it.note}</span></div>`
      : "";
    const recsHtml = it.recs ? `<div class="recs"><div class="rec-title">推薦</div>${it.recs.map(r=>`<div class="rec-item">${r}</div>`).join("")}</div>` : "";
    const imgHtml = it.image
      ? (it.imageUrl
          ? `<img class="d-img" src="${esc(it.imageUrl)}" alt="${esc(it.title)}">`
          : `<div class="img-placeholder"><span class="ic">🖼️</span><span>圖片區域</span></div>`)
      : "";
    const btns = [];
    if(detailData.mapUrl) btns.push(`<div class="btn" onclick="event.stopPropagation(); window.open('${esc(detailData.mapUrl)}','_blank')">導航</div>`);
    else if(detailData.address) btns.push(`<div class="btn" onclick="event.stopPropagation(); openMap('${esc(detailData.address)}')">地圖</div>`);
    if(detailData.websiteUrl) btns.push(`<div class="btn" onclick="event.stopPropagation(); window.open('${esc(detailData.websiteUrl)}','_blank')">官方網站</div>`);
    if(detailData.bookingUrl) btns.push(`<div class="btn" onclick="event.stopPropagation(); window.open('${esc(detailData.bookingUrl)}','_blank')">訂房資訊</div>`);
    if(detailData.phone) btns.push(`<div class="btn primary" onclick="event.stopPropagation(); callPhone('${detailData.phone}')">撥打電話</div>`);
    else if(detailData.address) btns.push(`<div class="btn" onclick="event.stopPropagation(); copyText('${esc(detailData.address)}')">複製地址</div>`);
    return `
      <div class="t-row ${isOpen?'open':''}" onclick="toggleItem('${id}')">
        <div class="t-time mono">${it.s}</div>
        <div class="t-mid"><div class="t-dot ${isCurrent?'current':''}"></div></div>
        <div class="t-body">
          <div class="t-head">
            <span class="t-icon">${it.icon}</span>
            <span class="t-title">${it.title}</span>
            ${it.status==="confirmed"?'<span class="status-badge confirmed">✓ 已確認</span>':'<span class="status-badge tentative">暫定</span>'}
            ${isCurrent?'<span class="t-tag">NOW</span>':''}
            <span class="t-chev">▶</span>
          </div>
          <div class="t-detail">
            <div class="t-detail-inner" onclick="event.stopPropagation()">
              ${imgHtml}
              <div class="d-desc">${stay?stay.hotelName:it.desc}</div>
              ${stay?stayDetailLines(stay,it.title==="酒店寄存行李" ? it.note : null):`<div class="d-line"><span class="k">📍</span><span class="v">${it.address||"—"}</span></div>
              <div class="d-line"><span class="k">💰</span><span class="v">${it.price||"—"}</span></div>
              ${it.phone?`<div class="d-line"><span class="k">☎</span><span class="v">${it.phone}</span></div>`:""}${itemNoteHtml}`}
              ${it.transport?`<div class="d-line"><span class="k">🚦</span><span class="v">${it.transport}</span></div>`:""}
              ${recsHtml}
              ${btns.length?`<div class="btn-row">${btns.join("")}</div>`:""}
            </div>
          </div>
        </div>
      </div>
    `;
  }).join("");
  renderDayExtra(day);
}
function timeToMinutes(time){
  const match=/^(\d{2}):(\d{2})$/.exec(time||"");
  if(!match) return null;
  const hours=Number(match[1]), minutes=Number(match[2]);
  return hours<24 && minutes<60 ? hours*60+minutes : null;
}
function minutesToTime(totalMinutes){
  const normalized=((totalMinutes%1440)+1440)%1440;
  const hours=Math.floor(normalized/60), minutes=normalized%60;
  return `${String(hours).padStart(2,"0")}:${String(minutes).padStart(2,"0")}`;
}
function renderFlightArrivalCheck(day){
  const planned=day.airportArrivalTime;
  const flight=TRIP.flights.find(f=>f.date===day.date && f.type==="return" && f.status==="confirmed");
  const plannedMinutes=timeToMinutes(planned);
  const departureMinutes=timeToMinutes(flight?.depart);
  if(plannedMinutes==null || departureMinutes==null) return "";
  const latestMinutes=departureMinutes-120;
  const latest=minutesToTime(latestMinutes);
  const late=plannedMinutes>latestMinutes;
  const status=late
    ? "⚠️ 預計抵達機場時間晚於建議時間，請縮短前方行程。"
    : "✓ 預計機場抵達時間仍在建議範圍內";
  return `
    <div class="transport-budget">
      <div class="tb-title">✈️ 機場抵達時間</div>
      <div class="tb-line"><span>預計抵達澳門機場</span><span class="v">${planned}</span></div>
      <div class="tb-line"><span>建議最晚抵達</span><span class="v">${latest}</span></div>
      <div class="flight-arrival-status ${late?"late":"safe"}">${status}</div>
    </div>`;
}
/* 選填的「今日交通預算」區塊：只有該天資料裡有 transportBudget 才會顯示 */
function renderDayExtra(day){
  const el=document.getElementById("day-extra");
  if(!el) return;
  const tb = day && day.transportBudget;
  const db = day && day.dayBudget;
  const arrivalNotice = day && day.arrivalNotice;
  let html = "";
  if(tb){
    html += `
    <div class="transport-budget">
      <div class="tb-title">💰 今日交通預算</div>
      ${(tb.items||[]).map(i=>`<div class="tb-line"><span>${i.label}</span><span class="v">${i.cost}</span></div>`).join("")}
      ${tb.total?`<div class="tb-total">交通預估：<b>${tb.total}</b></div>`:""}
      ${tb.note?`<div class="tb-note">＊${tb.note}</div>`:""}
    </div>`;
  }
  if(db){
    html += `
    <div class="transport-budget">
      <div class="tb-title">💰 今日預算</div>
      <div class="tb-line"><span>交通</span><span class="v">${db.transport}</span></div>
      ${db.attractions&&db.attractions.length?`<div class="tb-group">景點</div>${db.attractions.map(a=>`<div class="tb-line"><span>${a.name}</span><span class="v">${a.cost}</span></div>`).join("")}`:""}
      ${db.food?`<div class="tb-group">餐飲</div><div class="tb-line"><span>${db.food.label}</span><span class="v">${db.food.cost}</span></div>`:""}
      ${db.other?`<div class="tb-group">其他</div><div class="tb-line"><span>${db.other.label}</span><span class="v">${db.other.cost}</span></div>`:""}
      ${db.total?`<div class="tb-total">今日總預算：<b>${db.total}</b></div>`:""}
      ${db.note?`<div class="tb-note">＊${db.note}</div>`:""}
    </div>`;
  }
  if(day && day.airportArrivalTime) html += renderFlightArrivalCheck(day);
  if(arrivalNotice){
    html += `
    <div class="travel-warning">
      <div class="tw-title">⚠️ ${arrivalNotice.title}</div>
      <div class="tw-intro">${arrivalNotice.intro}</div>
      <ul class="tw-list">${(arrivalNotice.items||[]).map(item=>`<li>${item}</li>`).join("")}</ul>
      ${(arrivalNotice.details||[]).map(detail=>`<div class="tw-detail">${detail}</div>`).join("")}
    </div>`;
  }
  el.innerHTML = html;
}
function toggleItem(id){ state.openId = state.openId===id ? null : id; renderTimeline(); }

/* ---- page switching ---- */
function switchPage(page){
  state.page=page;
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById("page-"+page).classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active", b.dataset.page===page));
  if(page==="itinerary"){ renderTabs(); renderTimeline(); }
  if(page==="exchange"){ renderExchange(); }
}
document.querySelectorAll(".nav-btn").forEach(btn=>btn.addEventListener("click",()=>switchPage(btn.dataset.page)));
document.getElementById("currency-amount").addEventListener("input",renderExchange);
document.getElementById("currency-from").addEventListener("change",renderExchange);
renderExchange();

function setPreset(val){ simInput.value=val; state.simTime=val; btnSim.classList.add("active"); btnReal.classList.remove("active"); refreshAll(); }

/* ---- refresh loop ---- */
function refreshAll(){
  renderNow();
  renderTripProgress();
  if(state.page==="itinerary") renderTimeline();
}
/* ---- 啟動流程：Supabase 成功 → 用雲端資料；失敗／未設定 → fallback 回內建 TRIP ---- */
async function initTrip(){
  try{
    const remote = await loadFromSupabase();
    if(remote && Array.isArray(remote.days) && remote.days.length){
      TRIP = remote;
    }
    // remote 為 null（未設定 Supabase）時，TRIP 維持預設的 DEFAULT_TRIP，不做任何事
  } catch(err){
    console.warn("Supabase 讀取失敗，改用內建行程資料：", err);
    TRIP = DEFAULT_TRIP; // 明確 fallback，確保 NOW／Day1~6／Timeline／航班／住宿都正常
  }
  buildFlat();
  renderDayNav();
  renderConfirmed();
  renderLastUpdated();
  if(state.page==="itinerary"){ renderTabs(); renderTimeline(); }
  refreshAll();
  setInterval(()=>{ if(!state.simTime) refreshAll(); },20000);
}
initTrip();
